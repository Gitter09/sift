[project]
name = "product-copilot"
version = "0.1.0"
description = "Product Research Copilot - scrape, cluster, and analyze product feedback"
requires-python = ">=3.11"

dependencies = [
    "praw>=7.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "openai>=1.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
copilot = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
