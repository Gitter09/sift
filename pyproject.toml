[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getsift"
version = "0.1.0"
description = "Sift - scrape, cluster, and analyze product feedback"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "praw>=7.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "openai>=1.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "curl_cffi>=0.7",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sift = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
