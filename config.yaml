# Sift Configuration

reddit:
  subreddits:
    - "SaaS"
    - "productivity"
    - "startups"
    - "software"
    - "AskReddit"
  search_sort: "relevance"
  max_posts: 30
  max_comments_per_post: 15
  # Rate limiting (Reddit API: 100 QPM / 1000 per 10 min for OAuth)
  # We target 80 req/min to leave generous headroom for PRAW internal calls
  target_rate_per_minute: 80
  # PRAW auto-waits up to this many seconds on Reddit rate limit errors
  praw_ratelimit_seconds: 300
  # Delay between subreddit searches (seconds)
  subreddit_delay: 2.0

g2:
  request_delay: 2.5
  max_pages: 5
  user_agent_rotation: true
  # Rate limiting (G2: no official API, Cloudflare + Akamai protection)
  # Safe threshold: ~10-15 req/min with delays + UA rotation
  max_requests_per_minute: 12
  backoff_base: 2.0
  max_backoff: 60.0
  max_retries: 3
  jitter_range: [0.5, 1.5]

clustering:
  embedding_model: "all-MiniLM-L12-v2"
  umap_n_neighbors: 15
  umap_n_components: 5
  hdbscan_min_cluster_size: 3
  hdbscan_min_samples: 1

llm:
  model: "gpt-4o-mini"
  temperature: 0.3
  max_tokens: 2000

logging:
  level: "INFO"
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"
