name: Test, Build, and Publish Package

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish the built package to PyPI after tests pass. Requires a unique PyPI project name and trusted publishing."
        required: true
        type: boolean
        default: false

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Sift with test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    name: Build source and wheel distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: getsift-python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  smoke-test-wheel:
    name: Smoke-test installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: getsift-python-package
          path: dist

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Verify CLI entry point
        run: sift --help

  github-release:
    name: Attach package to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke-test-wheel
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: getsift-python-package
          path: dist

      - name: Upload package files to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  pypi-publish:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke-test-wheel
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/getsift

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: getsift-python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
